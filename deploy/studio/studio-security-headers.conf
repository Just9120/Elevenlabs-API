# Browser security policy is authoritative at the public host boundary so it
# covers both the PWA document and /api responses. The HTTPS connect source is
# required for the runtime-configured S3/R2-compatible presigned PUT target;
# the exact ElevenLabs WSS origin is required by Live transcription.
# Google Picker's website-restricted key requires the public origin as the
# HTTP referrer; "origin" sends no path or query. Presigned PUT requests use
# this origin-only policy and separately disable cross-origin credentials.
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' https: wss://api.elevenlabs.io; frame-src https://docs.google.com https://drive.google.com https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), display-capture=(self)" always;
add_header X-Frame-Options "DENY" always;
