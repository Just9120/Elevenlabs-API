# Install only after the new origin, OAuth and storage checks pass.
# Old API requests are never replayed across origins. Query credentials are
# discarded; old OAuth attempts must be restarted from the new origin.
server {
    listen 80;
    listen [::]:80;
    server_name studio.librechat.online;
    access_log off;
    if ($request_method !~ ^(GET|HEAD)$) { return 410; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 302 https://studio.cloud-nodes.net/;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio.librechat.online;
    ssl_certificate /etc/letsencrypt/live/studio.librechat.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.librechat.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/studio-security-headers.conf;
    add_header Cache-Control "no-store" always;
    if ($request_method !~ ^(GET|HEAD)$) { return 410; }

    # OAuth codes and state must not be forwarded into a different browser
    # session; start a fresh connection on the new site instead.
    location = /api/google/oauth/callback {
        return 302 https://studio.cloud-nodes.net/settings/connections;
    }
    location /api/ {
        default_type application/json;
        return 410 '{"detail":"Studio moved to https://studio.cloud-nodes.net. Open the new site and sign in again."}';
    }
    location / {
        return 302 https://studio.cloud-nodes.net$uri;
    }
}
