server {
    listen 80;
    listen [::]:80;
    server_name studio.cloud-nodes.net;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 302 https://studio.cloud-nodes.net$uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name studio.cloud-nodes.net;
    ssl_certificate /etc/letsencrypt/live/studio.cloud-nodes.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.cloud-nodes.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4m;

    include /etc/nginx/snippets/studio-security-headers.conf;

    # The short-lived signed capability is carried in the WebSocket query
    # because browser WebSocket handshakes cannot set an Authorization header.
    # Keep that URL out of the access log and proxy the Upgrade explicitly.
    location = /api/realtime/yandex {
        access_log off;
        proxy_pass http://127.0.0.1:8182;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location /api/ {
        # API queries include OAuth credentials; API logs retain safe path/status.
        access_log off;
        proxy_pass http://127.0.0.1:8182;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
    }
}
