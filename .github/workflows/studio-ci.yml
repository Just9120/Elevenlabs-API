name: Studio PWA CI

on:
  pull_request:
    paths:
      - 'apps/studio/**'
      - 'apps/studio-api/**'
      - 'deploy/studio/**'
      - '.github/workflows/studio-ci.yml'
      - '.github/workflows/studio-platform-cd.yml'
      - '.github/workflows/studio-edge-cd.yml'
      - '.github/workflows/studio-migration-environment-probe.yml'
      - 'scripts/deploy_studio_platform_component.sh'
      - 'scripts/deploy_studio_platform_component_bundle_transport.sh'
      - 'scripts/studio_processing_preflight.sh'
      - 'scripts/check_studio_worker_secret.py'
      - 'scripts/configure_studio_database_roles.sh'
      - 'scripts/configure_studio_worker_db_role.sh'
      - 'tests/test_studio_processing_preflight.py'
      - 'tests/test_studio_database_roles.py'
      - 'tests/test_studio_worker_secret_metadata.py'
      - 'tests/test_studio_worker_db_role.py'
      - 'tests/test_studio_worker_db_role_integration.py'
      - 'tests/support/studio_web_network_smoke.py'
      - 'tests/test_studio_web_network_smoke.py'
      - 'scripts/migrate_studio_platform.sh'
      - 'scripts/release_studio_platform_migration.sh'
      - 'scripts/release_studio_edge.sh'
      - 'scripts/backup_studio_postgres_r2.sh'
      - 'tests/test_migrate_studio_platform.py'
      - 'tests/test_studio_migration_release.py'
      - 'tests/test_studio_edge_release.py'
      - 'tests/test_studio_migration_environment_probe.py'
      - 'tests/support/studio_browser_e2e_seed.py'
      - 'tests/test_studio_browser_e2e_contract.py'
      - 'docs/runbooks/studio-platform-ops.md'
  push:
    branches: [main]
    paths:
      - 'apps/studio/**'
      - 'apps/studio-api/**'
      - 'deploy/studio/**'
      - '.github/workflows/studio-ci.yml'
      - '.github/workflows/studio-platform-cd.yml'
      - '.github/workflows/studio-edge-cd.yml'
      - '.github/workflows/studio-migration-environment-probe.yml'
      - 'scripts/deploy_studio_platform_component.sh'
      - 'scripts/deploy_studio_platform_component_bundle_transport.sh'
      - 'scripts/studio_processing_preflight.sh'
      - 'scripts/check_studio_worker_secret.py'
      - 'scripts/configure_studio_database_roles.sh'
      - 'scripts/configure_studio_worker_db_role.sh'
      - 'tests/test_studio_processing_preflight.py'
      - 'tests/test_studio_database_roles.py'
      - 'tests/test_studio_worker_secret_metadata.py'
      - 'tests/test_studio_worker_db_role.py'
      - 'tests/test_studio_worker_db_role_integration.py'
      - 'tests/support/studio_web_network_smoke.py'
      - 'tests/test_studio_web_network_smoke.py'
      - 'scripts/migrate_studio_platform.sh'
      - 'scripts/release_studio_platform_migration.sh'
      - 'scripts/release_studio_edge.sh'
      - 'scripts/backup_studio_postgres_r2.sh'
      - 'tests/test_migrate_studio_platform.py'
      - 'tests/test_studio_migration_release.py'
      - 'tests/test_studio_edge_release.py'
      - 'tests/test_studio_migration_environment_probe.py'
      - 'tests/support/studio_browser_e2e_seed.py'
      - 'tests/test_studio_browser_e2e_contract.py'
      - 'docs/runbooks/studio-platform-ops.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci
        working-directory: apps/studio
      - run: npm run lint
        working-directory: apps/studio
      - run: npm run test -- --run
        working-directory: apps/studio
      - run: npm run build
        working-directory: apps/studio
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build Studio web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/studio
          load: true
          tags: elevenlabs-studio-web:test
          cache-from: type=gha,scope=studio-web
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=studio-web' || '' }}
          provenance: false
          sbom: false
      - name: Validate platform compose config
        run: |
          tmp=$(mktemp -d "$RUNNER_TEMP/studio-compose.XXXXXX")
          POSTGRES_PASSWORD_FILE="$tmp/postgres_password"
          CREDENTIAL_MASTER_KEY_FILE="$tmp/master_key"
          printf 'not-a-secret-ci-password' > "$POSTGRES_PASSWORD_FILE"
          python -c "import base64; print(base64.b64encode(b'3' * 32).decode())" > "$CREDENTIAL_MASTER_KEY_FILE"
          cp deploy/studio/.env.example "$tmp/.env"
          printf 'STUDIO_POSTGRES_PASSWORD_FILE=%s\nSTUDIO_CREDENTIAL_MASTER_KEY_FILE=%s\n' "$POSTGRES_PASSWORD_FILE" "$CREDENTIAL_MASTER_KEY_FILE" >> "$tmp/.env"
          docker compose --env-file "$tmp/.env" -f deploy/studio/compose.platform.yml config >/dev/null
      - name: Verify web host port publication
        run: python tests/support/studio_web_network_smoke.py
      - name: Build Studio API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: apps/studio-api
          load: true
          tags: elevenlabs-studio-api:test
          cache-from: type=gha,scope=studio-api
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=studio-api' || '' }}
          provenance: false
          sbom: false
      - name: Verify application metadata as non-root runtime
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 32 \
            --entrypoint python \
            elevenlabs-studio-api:test \
            -c '
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config("/app/alembic.ini"))
          heads = script.get_heads()
          assert len(heads) == 1
          revision = script.get_revision(heads[0])
          assert revision is not None
          assert getattr(revision.module, "release_safety", None) == "additive"
          print("STUDIO_MIGRATION_METADATA_OK")
          '
          task_probe_container="$(docker run --detach \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 32 \
            --user 0:0 \
            --entrypoint sleep \
            elevenlabs-studio-api:test 60)"
          [[ "$task_probe_container" =~ ^[0-9a-f]{64}$ ]]
          trap 'docker rm --force "$task_probe_container" >/dev/null' EXIT
          task_probe_head="$(docker exec \
            --user 10001:10001 \
            --workdir /app \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "$task_probe_container" \
            alembic -c /app/alembic.ini heads </dev/null)"
          [[ "$task_probe_head" =~ ^[[:alnum:]_]+\ \(head\)$ ]]
          echo STUDIO_RUNNING_CONTAINER_METADATA_OK
      - name: Verify metadata-only worker secret probe behind root-only directory
        run: |
          task_probe_dir="$(mktemp -d "$RUNNER_TEMP/studio-worker-secret.XXXXXX")"
          [[ "$task_probe_dir" == "$RUNNER_TEMP"/studio-worker-secret.* ]]
          trap 'sudo rm -f -- "$task_probe_dir/password" "$task_probe_dir/link"; sudo rmdir -- "$task_probe_dir"' EXIT
          printf 'synthetic-ci-worker-password' > "$task_probe_dir/password"
          chmod 600 "$task_probe_dir/password"
          chmod 700 "$task_probe_dir"
          sudo chown root:root "$task_probe_dir" "$task_probe_dir/password"
          if sudo -u nobody test -f "$task_probe_dir/password"; then
            echo 'fixture is not root-only'; exit 1
          fi
          task_probe_image="$(docker image inspect --format '{{.Id}}' elevenlabs-studio-api:test)"
          [[ "$task_probe_image" =~ ^sha256:[0-9a-f]{64}$ ]]
          task_probe() {
            docker run --rm --pull never --network none --read-only --user 0:0 \
              --cap-drop ALL --security-opt no-new-privileges --pids-limit 32 \
              --memory 64m --memory-swap 64m --cpus 0.25 --log-driver none \
              --mount "type=bind,src=${task_probe_dir},dst=/run/studio-worker-secret-probe,readonly,bind-recursive=disabled" \
              --entrypoint python -i "$task_probe_image" -I -S - "$1" \
              < scripts/check_studio_worker_secret.py
          }
          task_probe password
          sudo chmod 400 "$task_probe_dir/password"
          task_probe password
          sudo chmod 644 "$task_probe_dir/password"
          if task_probe password; then echo 'unsafe permissions accepted'; exit 1; fi
          sudo chmod 600 "$task_probe_dir/password"
          sudo ln -s password "$task_probe_dir/link"
          if task_probe link; then echo 'symlink accepted'; exit 1; fi
          if task_probe absent; then echo 'missing file accepted'; exit 1; fi
          sudo truncate --size 0 "$task_probe_dir/password"
          if task_probe password; then echo 'empty file accepted'; exit 1; fi
          echo STUDIO_WORKER_SECRET_METADATA_OK
      - name: Verify protected secret bootstrap and non-root runtime
        run: |
          tmp=$(mktemp -d "$RUNNER_TEMP/studio-secret-bootstrap.XXXXXX")
          trap 'rm -rf "$tmp"' EXIT
          secret_file="$tmp/postgres_password"
          printf 'synthetic-ci-secret' > "$secret_file"
          chmod 600 "$secret_file"
          test "$(docker image inspect --format '{{.Config.User}}' elevenlabs-studio-api:test)" = "10001:10001"
          docker run --rm \
            --user 0:0 \
            --mount "type=bind,src=$secret_file,dst=/run/secrets/studio_postgres_password,readonly" \
            --tmpfs /run/studio-runtime-secrets:rw,noexec,nosuid,size=1m,mode=0711,uid=0,gid=0 \
            --env STUDIO_CONTAINER_SECRET_BOOTSTRAP=required \
            --env STUDIO_POSTGRES_PASSWORD_FILE=/run/studio-runtime-secrets/studio_postgres_password \
            elevenlabs-studio-api:test \
            python -c '
          import os
          import stat
          from pathlib import Path

          runtime = Path("/run/studio-runtime-secrets/studio_postgres_password")
          source = Path("/run/secrets/studio_postgres_password")
          metadata = runtime.stat()
          assert os.geteuid() == 10001
          assert os.getegid() == 10001
          assert metadata.st_uid == 10001
          assert metadata.st_gid == 10001
          assert stat.S_IMODE(metadata.st_mode) == 0o400
          assert runtime.read_text(encoding="utf-8") == "synthetic-ci-secret"
          try:
              source.read_bytes()
          except PermissionError:
              pass
          else:
              raise AssertionError("protected source secret remained readable")
          '
      - run: echo "STUDIO_CI_OK"

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: studio_browser_e2e
          POSTGRES_USER: studio_test
          POSTGRES_PASSWORD: studio_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio_test -d studio_browser_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
    env:
      STUDIO_ENVIRONMENT: test
      STUDIO_DATABASE_SCHEME: postgresql+psycopg
      STUDIO_DATABASE_HOST: 127.0.0.1
      STUDIO_DATABASE_PORT: '5432'
      STUDIO_DATABASE_NAME: studio_browser_e2e
      STUDIO_DATABASE_USER: studio_test
      STUDIO_REDIS_URL: redis://127.0.0.1:6379/0
      STUDIO_APP_ORIGIN: http://127.0.0.1:4173
      STUDIO_COOKIE_NAME: studio_e2e_session
      STUDIO_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            apps/studio-api/requirements.txt
            apps/studio-api/constraints.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Restore exact Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('apps/studio/package-lock.json') }}
      - name: Install Studio API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/studio-api/requirements.txt -c apps/studio-api/constraints.txt
      - name: Install Studio browser dependencies
        run: npm ci
        working-directory: apps/studio
      - name: Create browser E2E fixture secret files
        run: |
          POSTGRES_PASSWORD_FILE="$RUNNER_TEMP/studio_browser_e2e_postgres_password"
          CREDENTIAL_MASTER_KEY_FILE="$RUNNER_TEMP/studio_browser_e2e_master_key"
          printf 'studio_test_password' > "$POSTGRES_PASSWORD_FILE"
          python -c "import base64; print(base64.b64encode(b'5' * 32).decode())" > "$CREDENTIAL_MASTER_KEY_FILE"
          printf 'STUDIO_POSTGRES_PASSWORD_FILE=%s\n' "$POSTGRES_PASSWORD_FILE" >> "$GITHUB_ENV"
          printf 'STUDIO_CREDENTIAL_MASTER_KEY_FILE=%s\n' "$CREDENTIAL_MASTER_KEY_FILE" >> "$GITHUB_ENV"
      - name: Run browser E2E migrations
        run: alembic -c apps/studio-api/alembic.ini upgrade head
      - name: Seed isolated browser E2E state
        run: python tests/support/studio_browser_e2e_seed.py
      - name: Install Chromium on exact cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: apps/studio
      - name: Run authenticated browser E2E
        run: npm run test:e2e
        working-directory: apps/studio
      - name: Upload browser E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studio-browser-e2e-${{ github.run_id }}
          path: apps/studio/test-results
          if-no-files-found: warn
          retention-days: 7
      - run: echo "STUDIO_BROWSER_E2E_OK"
