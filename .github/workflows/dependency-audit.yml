name: Dependency audit
run-name: Dependency audit · ${{ github.ref_name }} · ${{ github.sha }}

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Install Studio frontend dependencies without lifecycle scripts
        id: node-install
        run: npm ci --ignore-scripts --no-audit
        working-directory: apps/studio
      - name: Audit Studio frontend dependency graph
        id: node-audit
        run: npm audit --audit-level=low
        working-directory: apps/studio
      - name: Mark Node audit success
        run: echo "NODE_DEPENDENCY_AUDIT_OK"
      - name: Summarize Node dependency audit
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.node-install.outcome }}
          AUDIT_OUTCOME: ${{ steps.node-audit.outcome }}
        run: |
          {
            echo "## Node dependency audit"
            echo
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Install: \`${INSTALL_OUTCOME}\`"
            echo "- Audit: \`${AUDIT_OUTCOME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints-dev.txt
            apps/studio-api/requirements.txt
            apps/studio-api/constraints.txt
      - name: Install audit tool and constrained dependency graph
        id: python-install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit==2.10.1
          python -m pip install --target "$RUNNER_TEMP/studio-python-audit" -r requirements-dev.txt -c constraints-dev.txt
      - name: Audit installed Python dependency graph
        id: python-audit
        run: python -m pip_audit --strict --path "$RUNNER_TEMP/studio-python-audit"
      - name: Mark Python audit success
        run: echo "PYTHON_DEPENDENCY_AUDIT_OK"
      - name: Summarize Python dependency audit
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.python-install.outcome }}
          AUDIT_OUTCOME: ${{ steps.python-audit.outcome }}
        run: |
          {
            echo "## Python dependency audit"
            echo
            echo "- Revision: \`${GITHUB_SHA}\`"
            echo "- Install: \`${INSTALL_OUTCOME}\`"
            echo "- Audit: \`${AUDIT_OUTCOME}\`"
          } >> "$GITHUB_STEP_SUMMARY"
