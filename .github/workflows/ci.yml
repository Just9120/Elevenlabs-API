name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      root: ${{ steps.plan.outputs.root }}
      studio: ${{ steps.plan.outputs.studio }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_validation.py plan
      - name: Lightweight checks for every change
        run: python scripts/ci_checks.py

  studio-validation:
    needs: selection
    if: needs.selection.outputs.studio == 'true'
    uses: ./.github/workflows/studio-ci.yml

  checks:
    needs: selection
    if: needs.selection.outputs.root == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: studio_test
          POSTGRES_PASSWORD: studio_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio_test -d studio_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 25
    env:
      STUDIO_DATABASE_SCHEME: postgresql+psycopg
      STUDIO_DATABASE_HOST: 127.0.0.1
      STUDIO_DATABASE_PORT: '5432'
      STUDIO_DATABASE_NAME: studio_test
      STUDIO_DATABASE_USER: studio_test
      STUDIO_REDIS_URL: redis://127.0.0.1:6379/0
      STUDIO_APP_ORIGIN: https://studio.test
      STUDIO_COOKIE_SECURE: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints-dev.txt

      - name: Create CI fixture secret files
        run: |
          POSTGRES_PASSWORD_FILE="$RUNNER_TEMP/studio_postgres_password"
          CREDENTIAL_MASTER_KEY_FILE="$RUNNER_TEMP/studio_credential_master_key"
          printf 'studio_test_password' > "$POSTGRES_PASSWORD_FILE"
          python -c "import base64; print(base64.b64encode(b'4' * 32).decode())" > "$CREDENTIAL_MASTER_KEY_FILE"
          printf 'STUDIO_POSTGRES_PASSWORD_FILE=%s\n' "$POSTGRES_PASSWORD_FILE" >> "$GITHUB_ENV"
          printf 'STUDIO_CREDENTIAL_MASTER_KEY_FILE=%s\n' "$CREDENTIAL_MASTER_KEY_FILE" >> "$GITHUB_ENV"

      - name: Run Alembic upgrade
        run: alembic -c apps/studio-api/alembic.ini upgrade head

      - name: Run lightweight CI checks
        run: python scripts/ci_checks.py

      - name: Run pytest
        # >2000 tests include repeated real PG migration/restore operations.
        # 180s cut off the suite before completion on the slower observed runner;
        # retain a bounded process deadline, diagnostic abort and hard kill.
        run: PYTHONFAULTHANDLER=1 timeout --signal=SIGABRT --kill-after=10s 300s python -X faulthandler -m pytest -vv

      - name: Mark CI success
        run: echo "CI_OK"

  ci-required:
    name: ci-required
    if: always()
    needs: [selection, checks, studio-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all selected checks
        env:
          SELECTION: ${{ needs.selection.result }}
          ROOT_REQUIRED: ${{ needs.selection.outputs.root }}
          ROOT_RESULT: ${{ needs.checks.result }}
          STUDIO_REQUIRED: ${{ needs.selection.outputs.studio }}
          STUDIO_RESULT: ${{ needs.studio-validation.result }}
        run: |
          test "$SELECTION" = success
          case "$ROOT_REQUIRED:$STUDIO_REQUIRED" in true:true|true:false|false:false) ;; *) exit 1 ;; esac
          if [ "$ROOT_REQUIRED" = true ]; then test "$ROOT_RESULT" = success; else test "$ROOT_RESULT" = skipped; fi
          if [ "$STUDIO_REQUIRED" = true ]; then test "$STUDIO_RESULT" = success; else test "$STUDIO_RESULT" = skipped; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record tested source identity
        env:
          VALIDATION_MODE: ${{ needs.selection.outputs.mode }}
        run: python scripts/ci_validation.py proof --mode "$VALIDATION_MODE"
      - name: Retain bounded non-executable validation identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-validation-identity
          path: ${{ runner.temp }}/identity.json
          retention-days: 7
          if-no-files-found: error

  cost-report:
    if: always()
    needs: [ci-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_validation.py metrics
