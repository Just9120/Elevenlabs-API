name: Studio Platform CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/studio/**'
      - 'apps/studio-api/**'
  workflow_dispatch:
    inputs:
      component:
        description: 'Studio platform component to deploy'
        required: true
        type: choice
        options:
          - web
          - api
          - migration
          - worker
      migration_target:
        description: 'One direct additive Alembic target; use head for the repository head'
        required: true
        default: head
        type: string

permissions:
  contents: read

concurrency:
  group: studio-platform-production
  cancel-in-progress: false

jobs:
  detect-components:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.detect.outputs.web }}
      api: ${{ steps.detect.outputs.api }}
      migration_release: ${{ steps.detect.outputs.migration_release }}
      worker: ${{ steps.detect.outputs.worker }}
      web_reason: ${{ steps.detect.outputs.web_reason }}
      api_reason: ${{ steps.detect.outputs.api_reason }}
      migration_reason: ${{ steps.detect.outputs.migration_reason }}
      worker_reason: ${{ steps.detect.outputs.worker_reason }}
    steps:
      - name: Checkout for push detection
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect selected components
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          web=false
          api=false
          migration_release=false
          worker=false
          web_reason=not_selected
          api_reason=not_selected
          migration_reason=not_selected
          worker_reason=not_selected

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.component }}" in
              web) web=true; web_reason=manual_selection ;;
              api) api=true; api_reason=manual_selection ;;
              migration)
                if [[ "${{ vars.STUDIO_MIGRATION_RELEASE_ENABLED }}" == "true" ]]; then
                  migration_release=true
                  migration_reason=manual_selection_approval_required
                  api_reason=migration_release_selected
                else
                  migration_reason=manual_migration_release_disabled
                  api_reason=manual_migration_required
                fi
                ;;
              worker) worker=true; worker_reason=manual_selection ;;
              *) echo "unsupported component" >&2; exit 1 ;;
            esac
          elif [[ "${{ vars.STUDIO_PLATFORM_CD_ENABLED }}" == "true" ]]; then
            web_reason=not_changed
            api_reason=not_changed
            migration_reason=not_changed
            worker_reason=manual_only
            before="${{ github.event.before }}"
            after="${{ github.sha }}"
            zero_sha="0000000000000000000000000000000000000000"

            if [[ "$before" == "$zero_sha" ]]; then
              changed_files="$(git diff-tree --no-commit-id --name-only -r "$after")"
            else
              changed_files="$(git diff --name-only "$before" "$after")"
            fi

            api_changed=false
            api_migration_changed=false
            worker_dependency_changed=false
            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              case "$path" in
                apps/studio/*)
                  web=true
                  ;;
                apps/studio-api/alembic/*|apps/studio-api/alembic.ini)
                  api_migration_changed=true
                  worker_dependency_changed=true
                  ;;
                apps/studio-api/studio_api/worker.py|apps/studio-api/studio_api/worker_health.py)
                  worker_dependency_changed=true
                  ;;
                apps/studio-api/*)
                  api_changed=true
                  worker_dependency_changed=true
                  ;;
              esac
            done <<< "$changed_files"

            if [[ "$web" == "true" ]]; then
              web_reason=source_changed
            fi

            if [[ "$api_migration_changed" == "true" ]]; then
              if [[ "${{ vars.STUDIO_MIGRATION_RELEASE_ENABLED }}" == "true" ]]; then
                migration_release=true
                migration_reason=source_changed_approval_required
                api_reason=migration_release_selected
              else
                api_reason=manual_migration_required
                migration_reason=automatic_migration_release_disabled
              fi
            elif [[ "$api_changed" == "true" ]]; then
              api=true
              api_reason=source_changed
            fi

            if [[ "$worker_dependency_changed" == "true" ]]; then
              worker_reason=manual_only_dependency_changed
            fi
          else
            web_reason=automatic_cd_disabled
            api_reason=automatic_cd_disabled
            migration_reason=automatic_cd_disabled
            worker_reason=automatic_cd_disabled
          fi

          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "migration_release=$migration_release" >> "$GITHUB_OUTPUT"
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "web_reason=$web_reason" >> "$GITHUB_OUTPUT"
          echo "api_reason=$api_reason" >> "$GITHUB_OUTPUT"
          echo "migration_reason=$migration_reason" >> "$GITHUB_OUTPUT"
          echo "worker_reason=$worker_reason" >> "$GITHUB_OUTPUT"

  deploy-web:
    needs: detect-components
    if: needs.detect-components.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "required deployment secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy web component
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -se -- /opt/elevenlabs-studio" <<'REMOTE'
          set -euo pipefail
          STUDIO_DEPLOY_DIR="$1"
          cd "$STUDIO_DEPLOY_DIR"
          git fetch --prune origin main
          deploy_script="$(mktemp)"
          trap 'rm -f "$deploy_script"' EXIT
          git show origin/main:scripts/deploy_studio_platform_component.sh >"$deploy_script"
          [[ -s "$deploy_script" ]]
          STUDIO_DEPLOY_DIR="$STUDIO_DEPLOY_DIR" bash "$deploy_script" web
          REMOTE

  deploy-api:
    needs:
      - detect-components
      - deploy-web
    if: always() && needs.detect-components.outputs.api == 'true' && needs.detect-components.outputs.migration_release != 'true' && (needs.detect-components.outputs.web != 'true' || needs.deploy-web.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "required deployment secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy API component
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -se -- /opt/elevenlabs-studio" <<'REMOTE'
          set -euo pipefail
          STUDIO_DEPLOY_DIR="$1"
          cd "$STUDIO_DEPLOY_DIR"
          git fetch --prune origin main
          deploy_script="$(mktemp)"
          trap 'rm -f "$deploy_script"' EXIT
          git show origin/main:scripts/deploy_studio_platform_component.sh >"$deploy_script"
          [[ -s "$deploy_script" ]]
          STUDIO_DEPLOY_DIR="$STUDIO_DEPLOY_DIR" bash "$deploy_script" api
          REMOTE

  release-api-migration:
    needs:
      - detect-components
      - deploy-web
    if: always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.component == 'migration')) && needs.detect-components.outputs.migration_release == 'true' && (needs.detect-components.outputs.web != 'true' || needs.deploy-web.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: studio-production-migration
    steps:
      - name: Validate guarded migration release inputs
        shell: bash
        env:
          MIGRATION_DEPLOY_HOST: ${{ secrets.STUDIO_MIGRATION_DEPLOY_HOST }}
          MIGRATION_SSH_KEY: ${{ secrets.STUDIO_MIGRATION_SSH_KEY }}
          MIGRATION_KNOWN_HOSTS: ${{ secrets.STUDIO_MIGRATION_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_target || 'head' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" == "refs/heads/main" ]] || {
            echo "migration release is allowed only from main" >&2
            exit 1
          }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "migration release SHA is invalid" >&2
            exit 1
          }
          [[ "$RELEASE_TARGET" =~ ^(head|[[:alnum:]_]+)$ ]] || {
            echo "migration release target is invalid" >&2
            exit 1
          }
          for name in MIGRATION_DEPLOY_HOST MIGRATION_SSH_KEY MIGRATION_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "required migration environment secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Configure dedicated forced-command SSH identity
        shell: bash
        env:
          MIGRATION_SSH_KEY: ${{ secrets.STUDIO_MIGRATION_SSH_KEY }}
          MIGRATION_KNOWN_HOSTS: ${{ secrets.STUDIO_MIGRATION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MIGRATION_SSH_KEY" > ~/.ssh/studio_migration_key
          chmod 600 ~/.ssh/studio_migration_key
          printf '%s\n' "$MIGRATION_KNOWN_HOSTS" > ~/.ssh/studio_migration_known_hosts
          chmod 600 ~/.ssh/studio_migration_known_hosts

      - name: Run approved exact-SHA migration release
        shell: bash
        env:
          MIGRATION_DEPLOY_HOST: ${{ secrets.STUDIO_MIGRATION_DEPLOY_HOST }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_target || 'head' }}
        run: |
          set -euo pipefail
          output_file="$(mktemp)"
          trap 'rm -f "$output_file"' EXIT
          if ! ssh \
            -i ~/.ssh/studio_migration_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/studio_migration_known_hosts \
            "root@$MIGRATION_DEPLOY_HOST" \
            "release $RELEASE_SHA $RELEASE_TARGET" >"$output_file" 2>&1; then
            cat "$output_file"
            exit 1
          fi
          cat "$output_file"
          grep -Fq \
            "[studio-migration-release] OK commit=${RELEASE_SHA:0:12} " \
            "$output_file"
          grep -Fq \
            "[studio-migration-release-wrapper] OK commit=${RELEASE_SHA:0:12}" \
            "$output_file"


  deploy-worker:
    needs: detect-components
    if: needs.detect-components.outputs.worker == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate deployment secrets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "required deployment secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy worker component manually
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -se -- /opt/elevenlabs-studio" <<'REMOTE'
          set -euo pipefail
          STUDIO_DEPLOY_DIR="$1"
          cd "$STUDIO_DEPLOY_DIR"
          git fetch --prune origin main
          deploy_script="$(mktemp)"
          trap 'rm -f "$deploy_script"' EXIT
          git show origin/main:scripts/deploy_studio_platform_component.sh >"$deploy_script"
          [[ -s "$deploy_script" ]]
          STUDIO_DEPLOY_DIR="$STUDIO_DEPLOY_DIR" bash "$deploy_script" worker
          REMOTE

  deployment-summary:
    needs:
      - detect-components
      - deploy-web
      - deploy-api
      - release-api-migration
      - deploy-worker
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize component deployment decisions
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect-components.result }}
          WEB_SELECTED: ${{ needs.detect-components.outputs.web }}
          WEB_REASON: ${{ needs.detect-components.outputs.web_reason }}
          WEB_RESULT: ${{ needs.deploy-web.result }}
          API_SELECTED: ${{ needs.detect-components.outputs.api }}
          API_REASON: ${{ needs.detect-components.outputs.api_reason }}
          API_RESULT: ${{ needs.deploy-api.result }}
          MIGRATION_SELECTED: ${{ needs.detect-components.outputs.migration_release }}
          MIGRATION_REASON: ${{ needs.detect-components.outputs.migration_reason }}
          MIGRATION_RESULT: ${{ needs.release-api-migration.result }}
          WORKER_SELECTED: ${{ needs.detect-components.outputs.worker }}
          WORKER_REASON: ${{ needs.detect-components.outputs.worker_reason }}
          WORKER_RESULT: ${{ needs.deploy-worker.result }}
        run: |
          set -euo pipefail

          web_decision=skip
          api_decision=skip
          migration_decision=skip
          worker_decision=skip
          [[ "$WEB_SELECTED" == "true" ]] && web_decision=deploy
          [[ "$API_SELECTED" == "true" ]] && api_decision=deploy
          [[ "$MIGRATION_SELECTED" == "true" ]] && migration_decision=protected-release-selected
          [[ "$WORKER_SELECTED" == "true" ]] && worker_decision=deploy

          WEB_REASON="${WEB_REASON:-detection_unavailable}"
          API_REASON="${API_REASON:-detection_unavailable}"
          MIGRATION_REASON="${MIGRATION_REASON:-detection_unavailable}"
          WORKER_REASON="${WORKER_REASON:-detection_unavailable}"

          {
            echo "## Studio platform deployment summary"
            echo
            printf 'Component detection: `%s`\n\n' "$DETECT_RESULT"
            echo "| Component | Decision | Job result | Reason |"
            echo "| --- | --- | --- | --- |"
            printf '| web | `%s` | `%s` | `%s` |\n' "$web_decision" "$WEB_RESULT" "$WEB_REASON"
            printf '| api | `%s` | `%s` | `%s` |\n' "$api_decision" "$API_RESULT" "$API_REASON"
            printf '| api migration release | `%s` | `%s` | `%s` |\n' "$migration_decision" "$MIGRATION_RESULT" "$MIGRATION_REASON"
            printf '| worker | `%s` | `%s` | `%s` |\n' "$worker_decision" "$WORKER_RESULT" "$WORKER_REASON"
            echo
            if [[ "$API_REASON" == "manual_migration_required" ]]; then
              echo "- API deployment was intentionally skipped because the guarded migration release lane is disabled."
            fi
            if [[ "$MIGRATION_REASON" == "source_changed_approval_required" || "$MIGRATION_REASON" == "manual_selection_approval_required" ]]; then
              echo "- The selected migration job is bound to the protected studio-production-migration environment before any VPS action."
              echo "- Environment binding alone does not prove a reviewer pause or approval; verify the deployment review history."
            fi
            if [[ "$WORKER_REASON" == "manual_only_dependency_changed" ]]; then
              echo "- A worker runtime dependency changed, but worker deployment remains manual-only."
            fi
            echo
            echo "> A green workflow does not mean every component was deployed. Deployment evidence exists only for a selected deploy/release job that completed with result \`success\`."
          } >> "$GITHUB_STEP_SUMMARY"
